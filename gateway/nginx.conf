# API Gateway de SIEASAS (tesis 2.8.4, 3.17 y Figura 53).
# App Ejecutiva -> Nginx -> núcleo (/auth) y los cuatro microservicios del Ejecutivo.
#
# Precedencia de Nginx: primero las ubicaciones exactas (=); después el prefijo más largo, que
# solo detiene la búsqueda si lleva ^~; luego las expresiones regulares (~) en orden de
# aparición, y solo si ninguna coincide se usa el prefijo más largo. Por eso /ejecutivo/ es un
# prefijo SIN ^~: si lo tuviera, ocultaría las rutas regex de los microservicios.
# gateway/tests/test_nginx_routes.py verifica esta tabla contra las rutas que usa Flutter.

# DNS interno de Docker: el gateway arranca y sigue atendiendo aunque un servicio esté detenido;
# solo las rutas de ese servicio responden 503.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;

# GET /ejecutivo/solicitudes lista (Detalle); POST registra (Registro). OPTIONS/HEAD -> Detalle,
# que responde CORS con la misma configuración.
map $request_method $solicitudes_up {
    POST    registro;
    default detalle;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

# Sin $request ni $args: la URL de recuperación lleva el token en la consulta y no debe quedar
# en los registros (tesis 4.6.3), igual que en backend/serve_web.py.
log_format sgsc '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                '$request_time rid=$request_id upstream=$upstream_addr';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log sgsc;

    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # El encabezado Authorization (Bearer) se reenvía sin cambios a cada servicio.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    default_type application/json;
    error_page 502 503 504 = @no_disponible;
    location @no_disponible {
        default_type application/json;
        return 503 '{"detail":"El servicio no está disponible. Intenta nuevamente."}';
    }

    location = /nginx-health { access_log off; default_type text/plain; return 200 'ok'; }

    # --- Indicadores y Filtros ---
    location ~ ^/ejecutivo/(dashboard|comparacion|catalogos)$ {
        set $servicio indicadores;
        proxy_pass http://$servicio:8000;
    }

    # --- Detalle de Indicadores (GET) / Registro Ejecutivo (POST) ---
    location = /ejecutivo/solicitudes {
        proxy_pass http://$solicitudes_up:8000;
    }
    # sugerencias y /solicitudes/{sid}; [^/]+ para que un id inválido siga respondiendo el 422 de FastAPI.
    location ~ ^/ejecutivo/solicitudes/[^/]+$ {
        set $servicio detalle;
        proxy_pass http://$servicio:8000;
    }

    # --- Registro Ejecutivo ---
    location ~ ^/ejecutivo/(personas|colonias|municipios-nacimiento)$ {
        set $servicio registro;
        proxy_pass http://$servicio:8000;
    }

    # --- Reportes y Exportación --- (un formato inválido sigue respondiendo el 422 de FastAPI)
    location ~ ^/ejecutivo/exportar/[^/]+$ {
        set $servicio reportes;
        proxy_read_timeout 120s;
        proxy_pass http://$servicio:8000;
    }

    # Cualquier otra ruta del Ejecutivo: 404 con el mismo cuerpo que FastAPI.
    location /ejecutivo/ {
        return 404 '{"detail":"Not Found"}';
    }

    # --- Núcleo: autenticación, sin cambios ---
    location = /auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        set $servicio nucleo;
        proxy_pass http://$servicio:8000;
    }
    location ^~ /auth/ {
        set $servicio nucleo;
        proxy_pass http://$servicio:8000;
    }

    # Ciudadano: fuera del alcance (tesis, «Trabajos a futuro»). No se publica por el gateway.
    location ^~ /ciudadano/ {
        return 404 '{"detail":"Not Found"}';
    }

    # --- Salud ---
    location ~ ^/health(/db)?$ {
        set $servicio nucleo;
        proxy_pass http://$servicio:8000;
    }
    location ~ ^/health/(indicadores|detalle|registro|reportes)$ {
        set $servicio $1;
        proxy_pass http://$servicio:8000/health/db;
    }

    # La documentación OpenAPI no se publica.
    location ~ ^/(docs|redoc|openapi\.json)(/|$) {
        return 404 '{"detail":"Not Found"}';
    }

    # --- App Ejecutiva (Flutter web), mismas cabeceras que backend/serve_web.py ---
    location / {
        root /usr/share/nginx/html;
        default_type application/octet-stream;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-store always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Content-Type-Options nosniff always;
        # Compresión solo de los archivos estáticos de Flutter (main.dart.js pesa ~3.6 MB sin
        # comprimir); las respuestas de la API no se comprimen.
        gzip on;
        gzip_vary on;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types text/css application/javascript text/javascript application/json
                   application/manifest+json application/wasm image/svg+xml font/ttf font/otf;
    }
}
