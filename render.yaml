# Render Blueprint: publica la API del Ejecutivo (FastAPI) con HTTPS.
# Los valores secretos (Aiven, AUTH_ENCRYPTION_KEY, SMTP) se capturan en el panel de Render,
# nunca en este archivo. El certificado de Aiven se sube como Secret File llamado ca.pem.
services:
  - type: web
    name: siesas-ejecutivo-api
    runtime: python
    plan: free
    rootDir: backend
    branch: dev
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DB_SSL
        value: "true"
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: DB_NAME
        value: siesas-v2
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: AUTH_ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://127.0.0.1:5173,http://localhost:5173
      # Recuperación de contraseña por correo (opcional; sin estos valores no se envían correos).
      - key: RESET_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SSL
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        sync: false
