name: SonarQube Cloud

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Análisis SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para que Sonar detecte el código nuevo

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Instalar dependencias de Flutter
        working-directory: sgsc_ejecutiva
        run: flutter pub get

      - name: Pruebas de Flutter con cobertura
        working-directory: sgsc_ejecutiva
        run: flutter test --coverage
        continue-on-error: true # si una prueba falla, el análisis se hace de todos modos

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Instalar dependencias del backend
        working-directory: backend
        run: pip install -r requirements.lock.txt pytest-cov==7.1.0

      - name: Pruebas del backend con cobertura
        working-directory: backend
        # Sin base de datos: las pruebas que necesitan MySQL se omiten solas (RUN_DB_TESTS).
        run: python -m pytest -q --cov=app --cov=serve_web --cov-report=xml:coverage.xml
        continue-on-error: true

      - name: Pruebas de sgsc_common con cobertura
        working-directory: backend/libs/sgsc_common
        run: PYTHONPATH=. python -m pytest -q --cov=sgsc_common --cov-report=xml:coverage.xml
        continue-on-error: true

      - name: Análisis SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
