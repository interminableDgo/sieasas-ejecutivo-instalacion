# Configuración de SonarQube Cloud para SGSC (análisis desde GitHub Actions)
sonar.projectKey=interminableDgo_SGSC
sonar.organization=interminabledgo
sonar.projectName=SGSC
sonar.sourceEncoding=UTF-8

# Código fuente: frontend Flutter, backend Python (núcleo + microservicios) y gateway
sonar.sources=sgsc_ejecutiva/lib,backend,gateway

# Pruebas: comparten carpetas con el código, se separan por patrón
sonar.tests=sgsc_ejecutiva/test,backend,gateway
sonar.test.inclusions=sgsc_ejecutiva/test/**,**/tests/**,**/test_*.py

# Fuera del análisis: pruebas (ya van como tests), entornos virtuales y archivos locales/generados
sonar.exclusions=**/tests/**,**/test_*.py,backend/.venv*/**,**/__pycache__/**,backend/*.local.*,**/*.g.dart,**/*.freezed.dart

# Lenguajes
sonar.python.version=3.12

# Cobertura de pruebas de Flutter (la genera el workflow con flutter test --coverage)
sonar.dart.lcov.reportPaths=sgsc_ejecutiva/coverage/lcov.info
