# Configuración de SonarQube Cloud para SGSC (análisis desde GitHub Actions)
sonar.projectKey=interminableDgo_SGSC
sonar.organization=interminabledgo
sonar.projectName=SGSC
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analiza todo el repositorio por defecto (sonar.sources/sonar.tests ya no tienen efecto).
# Se analiza: sgsc_ejecutiva/lib (Flutter), backend (núcleo + microservicios) y gateway.
# Fuera del análisis: pruebas y evidencias, carpetas de plataforma generadas por Flutter,
# entornos virtuales, archivos locales/generados y el workflow de CI.
sonar.exclusions=pruebas/**,docs/**,.github/**,\
  sgsc_ejecutiva/test/**,sgsc_ejecutiva/android/**,sgsc_ejecutiva/ios/**,sgsc_ejecutiva/linux/**,\
  sgsc_ejecutiva/macos/**,sgsc_ejecutiva/windows/**,sgsc_ejecutiva/web/**,\
  **/tests/**,**/test_*.py,backend/.venv*/**,**/__pycache__/**,backend/*.local.*,\
  **/*.g.dart,**/*.freezed.dart

# Lenguajes
sonar.python.version=3.12

# Cobertura de pruebas de Flutter (la genera el workflow con flutter test --coverage)
sonar.dart.lcov.reportPaths=sgsc_ejecutiva/coverage/lcov.info

# Cobertura de pruebas de Python (la genera el workflow con pytest --cov): monolito + serve_web.py
# y la librería compartida sgsc_common.
sonar.python.coverage.reportPaths=backend/coverage.xml,backend/libs/sgsc_common/coverage.xml

# Los scripts de PowerShell (iniciar.ps1, etc.) no tienen pruebas automatizadas medibles.
sonar.coverage.exclusions=**/*.ps1
